<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Copilot 自动对话演示</title>
<style>
body{margin:0;background:#f4f6f8;color:#17212b;font:14px system-ui}main{max-width:1280px;margin:auto;padding:18px}.top,.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}.controls{background:#fff;border:1px solid #d7dfe7;border-radius:7px;padding:12px;margin:14px 0}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(440px,1.4fr);gap:16px}.panel{background:#fff;border:1px solid #d7dfe7;border-radius:7px;padding:14px}.chat{height:68vh;overflow:auto;background:#f8fafc;padding:12px}.bubble{max-width:82%;padding:10px 12px;border-radius:10px;margin:9px 0;line-height:1.45}.user{margin-left:auto;background:#dcefff}.agent{background:#e8edf2}.meta,.muted{font-size:12px;color:#687786}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:68vh;overflow:auto}.item{border:1px solid #d6dee6;border-radius:5px;padding:10px}.target{border:3px solid #df512d;background:#fff1eb}.rank{font-weight:700;color:#1769aa}select,button{font:inherit;padding:9px;border-radius:5px}select{border:1px solid #bbc7d2}button{border:0;background:#1769aa;color:#fff;cursor:pointer;min-width:92px}.status{color:#465563}@media(max-width:850px){.layout{grid-template-columns:1fr}.chat,.grid{height:auto;max-height:60vh}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div><h1>Shopping Copilot</h1><div class="muted">基于公开评测器的自动多轮对话</div></div><button id="pause">暂停</button></div>
<div class="controls"><label>测试会话 <select id="scenario"></select></label><span id="status" class="status">正在初始化...</span></div>
<div class="layout"><section class="panel"><h2>模拟对话</h2><div id="chat" class="chat"></div></section><section class="panel"><h2>本轮 Top-10</h2><div id="target" class="muted"></div><div id="products" class="grid"></div></section></div>
</main><script>
let sid=null, paused=false, stopped=false, generation=0;
const $=id=>document.getElementById(id);
function bubble(role,text,n){const d=document.createElement('div');d.className='bubble '+role;d.innerHTML=`<div class="meta">${role==='user'?'模拟用户':'Agent'} · 第 ${n} 轮</div>${text}`;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function products(rows){$('products').innerHTML=rows.length?rows.map((p,i)=>`<div class="item ${p.target?'target':''}"><span class="rank">#${i+1}</span> ${p.title}<br><span class="muted">${p.parent_asin}${p.price==null?'':' · $'+p.price}</span>${p.target?'<br><b>★ 目标商品</b>':''}</div>`).join(''):'<div class="muted">本轮没有有效推荐</div>'}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function start(){const token=++generation;paused=false;stopped=false;$('pause').textContent='暂停';$('chat').innerHTML='';$('products').innerHTML='';const d=await(await fetch('/api/start?sample_id='+$('scenario').value)).json();if(token!==generation)return;sid=d.session_id;$('target').textContent='目标商品：'+d.target;$('status').textContent=`${d.sample_id} · ${d.scenario_type} · ${d.fallback?'Offline BM25':'Dense'}`;await wait(700);auto(token)}
async function auto(token){while(!stopped&&token===generation){if(paused){await wait(150);continue}const d=await(await fetch('/api/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})})).json();if(token!==generation)return;bubble('user',d.user,d.turn);await wait(500);bubble('agent',d.agent,d.turn);products(d.recommendations);$('status').textContent=$('status').textContent.split(' · 第')[0]+` · 第 ${d.turn}/10 轮`;if(d.hit)$('target').innerHTML=`<b>命中目标商品：Top ${d.hit_rank}</b>`;if(d.done){stopped=true;$('status').textContent+=d.hit?` · 目标商品进入 Top-10（第 ${d.hit_rank} 名）`:' · 已到达第 10 轮';break}await wait(1400)}}
async function init(){const rows=await(await fetch('/api/scenarios')).json();$('scenario').innerHTML=rows.map(x=>`<option value="${x.sample_id}">${x.sample_id} · ${x.scenario_type} · ${x.difficulty}</option>`).join('');start()}
$('pause').onclick=()=>{if(stopped)return;paused=!paused;$('pause').textContent=paused?'继续':'暂停'};$('scenario').onchange=start;init();
</script></body></html>
