    <button id="reset" title="Reset segment (R)">↺</button>
    <button id="autoplay" title="Rehearsal autoplay (P)">▶</button>
    <button id="backup" title="Segment terminal frame (B)">B</button>

  const phase=frame.phase;
  if(phase==='Message')return `<h3 class="inspector-title">Message received</h3><div class="info"><div class="info-label">Raw input</div><div class="info-value">“${esc(action.user)}”</div></div><div class="info"><div class="info-label">Session / turn</div><div class="info-value">${action.session} · ${action.turn} / 10</div></div><div class="info"><div class="info-label">State write</div><div class="info-value">Pending after understanding</div></div><div class="info"><div class="info-label">Agent response</div><div class="info-value">Hidden until phase 5</div></div>`;
  if(phase==='Intent')return `<h3 class="inspector-title">Intent resolution</h3><div class="route-flow"><div class="route-box">${esc(action.intent.before)}</div><b>→</b><div class="route-box active">${esc(action.intent.resolved)}</div></div><div class="info"><div class="info-label">Evidence</div><div class="chips">${action.intent.evidence.map(x=>`<span class="chip blue">${esc(x)}</span>`).join('')}</div></div><div class="info"><div class="info-label">Detected event</div><div class="info-value">${action.intent.events.length?action.intent.events.map(esc).join(' · '):'none'}</div></div><div class="info"><div class="info-label">Resolution source</div><div class="info-value">${esc(action.intent.source)} · route ${action.intent.changed?'changed':'retained'}</div></div><div class="config-strip"><b>rule path active</b> · intent model off</div>`;
  if(phase==='Slot Update')return `<h3 class="inspector-title">Slot manager</h3><div class="slot-section"><div class="slot-section-title">Before</div>${slotRows(action.slots.before)}</div><div class="slot-section"><div class="slot-section-title">Current delta</div>${slotRows(action.slots.delta)}</div><div class="slot-section"><div class="slot-section-title">Effective state</div>${slotRows(action.slots.effective)}</div>`;
  if(phase==='FSM / Execution')return `<h3 class="inspector-title">${esc(action.execution.route)} execution</h3><div class="info"><div class="info-label">Hard filters</div><div class="info-value">${action.execution.hardFilters.length?action.execution.hardFilters.map(esc).join('<br>'):'None · context and soft ranking remain active'}</div></div><div class="info"><div class="info-label">Ranking signals</div><div class="info-value">${action.execution.signals.map(esc).join(' · ')}</div></div><div class="ops">${action.execution.operations.map((op,i)=>`<div class="op"><span class="n">${i+1}</span><span>${esc(op)}</span></div>`).join('')}</div><div class="info"><div class="info-label">Verification / policy</div><div class="info-value"><b>${esc(action.execution.verification)}</b><br>${esc(action.execution.policy)}</div></div>`;
  const kind=action.fsm.kind==='clarify'?'clarify':action.fsm.kind==='relax'?'boundary':'';
  return `<h3 class="inspector-title">Agent response</h3><div class="decision ${kind}"><b>${esc(action.response.decision)}</b><br>${esc(action.response.text)}</div><div class="result-list">${action.response.results.map(([rank,text])=>`<div class="result"><b>${esc(rank)}</b><span>${esc(text)}</span></div>`).join('')}</div>${action.response.value?`<div class="info"><div class="info-label">Why it matters</div><div class="info-value value-note">${esc(action.response.value)}</div></div>`:''}<div class="info"><div class="info-label">Trace summary</div><div class="info-value">${esc(action.response.trace).replace(/\n/g,'<br>')}</div></div>`;
}

function architecture(frame,action){
  const phase=frame.phase;
  const phaseIndex=phaseOrder.indexOf(phase);
  const baseStatus=i=>{
    if(phaseIndex===0)return i===0?'active':'pending';
    if(phaseIndex===1)return i<2?'done':i===2?'active':'pending';
    if(phaseIndex===2)return i<3?'done':i===3?'active':'pending';
    if(phaseIndex===3){if(i<4)return'done';if(i<=7)return'active';return'pending'}
    return i<8?'done':'active';
  };
  return `<div class="arch-label">Active causal path · disabled components never appear as active</div><div class="arch-grid">${archNodes.map((node,i)=>{let status=baseStatus(i);if(phase==='FSM / Execution'&&action.fsm.kind==='relax'&&i===6)status='empty';if(phase==='FSM / Execution'&&action.fsm.kind==='relax'&&i===7)status='relax';return `<div class="arch-node ${status}"><strong>${node[0]}</strong><small>${node[1]}</small></div>`}).join('')}</div><div class="arch-note">${phase==='Message'?'Input accepted; downstream state and response remain pending.':phase==='Intent'?`Resolved ${esc(action.intent.before)} → ${esc(action.intent.resolved)} from rule evidence and events.`:phase==='Slot Update'?'Only the authored delta changes the current effective state.':phase==='FSM / Execution'?`${esc(action.fsm.guard)} → ${esc(action.fsm.branch)}.`:'The response and trace are now visible because verification and policy are complete.'}</div>`;
}

function conversation(frame,action){
  const responseVisible=frame.phase==='Agent Response';
  const previous=action.prior.map(([role,text])=>`<div class="bubble ${role}"><div class="role">${role}</div>${esc(text)}</div>`).join('');
  return `${previous}<div class="bubble user"><div class="role">User · turn ${action.turn}</div>${esc(action.user)}</div>${responseVisible?`<div class="bubble agent"><div class="role">Agent</div>${esc(action.response.text)}</div>`:`<div class="bubble pending"><div class="role">Agent</div>Response pending · phase ${phaseOrder.indexOf(frame.phase)+1} / 5</div>`}`;
}

function demo(frame){
  const action=ACTIONS[frame.actionKey];
  const branchClass=action.fsm.kind==='clarify'?'clarify':action.fsm.kind==='relax'?'relax':'';
  return `<section class="workspace"><div class="zone conversation"><div class="zone-head"><h3>Conversation</h3><span class="badge">${action.session} · T${action.turn}</span></div>${conversation(frame,action)}</div><div class="zone architecture"><div class="zone-head"><h3>Architecture trace</h3><span class="badge">${esc(frame.phase)}</span></div>${architecture(frame,action)}</div><div class="zone inspector"><div class="zone-head"><h3>Phase inspector</h3><span class="badge">${phaseOrder.indexOf(frame.phase)+1} / 5</span></div>${inspector(frame,action)}</div><div class="fsm-lane"><div class="fsm-box"><strong>Previous</strong><span>${esc(action.fsm.previous)}</span></div><span class="fsm-arrow">→</span><div class="fsm-box"><strong>Event / guard</strong><span>${esc(action.fsm.event)} · ${esc(action.fsm.guard)}</span></div><span class="fsm-arrow">→</span><div class="fsm-box"><strong>Next</strong><span>${esc(action.fsm.next)}</span></div><div class="fsm-box fsm-branch ${branchClass}"><strong>Branch reason</strong><span>${esc(action.fsm.branch)}</span></div></div></section>`;
}

function render(){
  const frame=frames[frameIndex];
  byId('stage').innerHTML=frame.view==='opening'?opening(frame):frame.view==='flow'?flow(frame):frame.view==='evidence'?staticEvidence(frame):frame.view==='value'?value(frame):demo(frame);
  byId('frameMeta').textContent=`${frame.id} · ${timeLabel(frame.start)}-${timeLabel(frame.end)} · ${frame.segmentLabel} · ${frame.phase}`;
  byId('narration').textContent=frame.narration;
  byId('prevFrame').disabled=frameIndex===0;
  byId('nextFrame').disabled=frameIndex===frames.length-1;
  byId('prevSegment').disabled=segments.indexOf(frame.segment)===0;
  byId('nextSegment').disabled=segments.indexOf(frame.segment)===segments.length-1;
  document.querySelectorAll('#segments button').forEach(button=>button.classList.toggle('active',button.dataset.segment===frame.segment));
}

function go(index){stopAuto();frameIndex=Math.max(0,Math.min(frames.length-1,index));render()}
function segmentStart(segment){return frames.findIndex(frame=>frame.segment===segment)}
function segmentEnd(segment){let found=-1;frames.forEach((frame,i)=>{if(frame.segment===segment)found=i});return found}
function moveSegment(delta){const current=segments.indexOf(frames[frameIndex].segment);go(segmentStart(segments[Math.max(0,Math.min(segments.length-1,current+delta))]))}
function stopAuto(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;byId('autoplay').textContent='▶'}}
function autoplay(){if(autoTimer){stopAuto();return}byId('autoplay').textContent='■';const advance=()=>{if(frameIndex>=frames.length-1){stopAuto();return}const duration=(frames[frameIndex].end-frames[frameIndex].start)*1000;autoTimer=setTimeout(()=>{frameIndex++;render();advance()},duration)};advance()}
async function toggleFull(){document.body.classList.toggle('clean-mode');if(document.body.classList.contains('clean-mode')&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!document.body.classList.contains('clean-mode')&&document.fullscreenElement)await document.exitFullscreen()}

byId('segments').innerHTML=segments.map(segment=>{const first=frames.find(frame=>frame.segment===segment);return `<button data-segment="${segment}" title="${first.segmentLabel}">${segment}</button>`}).join('');
byId('segments').onclick=event=>{if(event.target.dataset.segment)go(segmentStart(event.target.dataset.segment))};
byId('prevFrame').onclick=()=>go(frameIndex-1);byId('nextFrame').onclick=()=>go(frameIndex+1);
byId('prevSegment').onclick=()=>moveSegment(-1);byId('nextSegment').onclick=()=>moveSegment(1);
byId('reset').onclick=()=>go(segmentStart(frames[frameIndex].segment));byId('backup').onclick=()=>go(segmentEnd(frames[frameIndex].segment));
byId('autoplay').onclick=autoplay;byId('full').onclick=toggleFull;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('clean-mode')});
document.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();go(frameIndex+1)}else if(event.key==='Backspace'){event.preventDefault();go(frameIndex-1)}else if(event.key==='[')moveSegment(-1);else if(event.key===']')moveSegment(1);else if(event.key.toLowerCase()==='r')go(segmentStart(frames[frameIndex].segment));else if(event.key.toLowerCase()==='b')go(segmentEnd(frames[frameIndex].segment));else if(event.key.toLowerCase()==='p')autoplay();else if(event.key.toLowerCase()==='f')toggleFull()});

const requested=new URLSearchParams(location.search).get('frame');
if(requested){const found=frames.findIndex(frame=>frame.id===requested);if(found>=0){frameIndex=found;document.body.classList.add('asset-mode')}else document.body.innerHTML=`<main style="padding:40px;font-family:system-ui"><h1>Unknown frame</h1><p>${esc(requested)}</p></main>`}
render();
</script>
</body>
</html>
